      # Root User
      ROOT_USERNAME: root
      ROOT_PASSWORD: 123456
      
      # Database
      DB_HOST: 14.224.151.153
      DB_PORT: 5435
      DB_USERNAME: postgres
      DB_PASSWORD: iTomo1102
      DB_DATABASE: xl
      
      # Redis
      REDIS_HOST: redis-container
      REDIS_PORT: 6379
      REDIS_PASSWORD: iTomo8888
      REDIS_DB: 0
      REDIS_MAX_RETRIES: 5
      REDIS_CONNECT_TIMEOUT: 10000
      
      # Mail
      MAIL_SERVICE: gmail
      MAIL_HOST: ""
      MAIL_USERNAME: verify.itomo@gmail.com
      MAIL_PASSWORD: "xsbx bdmf lrtk ezjc"
      
      # Logging
      LOG_LEVEL: info
      LOG_DIR: ./logs
      LOG_FILE_NAME: app.log
      LOG_MAX_SIZE: 10485760
      LOG_MAX_FILES: 20
      SEQ_URL: https://log.itomo.one
      SEQ_API_KEY: ""
      
      # JWT
      JWT_ACCESS_SECRET: Ajbcdefghijklmnopqrstuvwxyz123456
      JWT_REFRESH_SECRET: BHyyy654321mnopqrstuvwxyzAbcdefghijkl
      JWT_ACCESS_EXPIRES_IN: 12h
      JWT_REFRESH_EXPIRES_IN: 7d
      
      # App Config
      APP_NAME: Backend App
      APP_VERSION: 1.0.0
      
      # Upload
      UPLOAD_DIR: uploads
      AVATAR_DIR: avatar
      FILE_DIR: files
      TEMP_DIR: temp
      
      # Time
      TIME_CONVERSION_START_DATE: "2025-11-01T00:00:00.000Z"
      TIME_CONVERSION_RATE: "1"
      
      # Excel Config
      JVT_ORDER_START_ROW: 1
      JVT_ORDER_START_COL: 1
      GHN_ORDER_START_ROW: 1
      GHN_ORDER_START_COL: 1
      JVT_RECONCILIATION_START_ROW: 3
      JVT_RECONCILIATION_START_COL: 1
      GHN_RECONCILIATION_START_ROW: 21
      GHN_RECONCILIATION_START_COL: 1
      
      # Socket Names
      SOCKET_IMPORT_ORDER: import_order
      SOCKET_IMPORT_ORDER_UPDATE: import_order_update
      SOCKET_IMPORT_SHIPPING_UNIT_RECONCILIATION: import_shipping_unit_reconciliation
      SOCKET_IMPORT_SHOP_RECONCILIATION: import_shop_reconciliation
      SOCKET_IMPORT_SHOP_RECONCILIATION_UPDATE: import_shop_reconciliation_update
      SOCKET_IMPORT_ORDER_RETURN_RECONCILIATION: import_order_return_reconciliation
      SOCKET_IMPORT_ORDER_RETURN_REPORT: import_order_return_report
      SOCKET_IMPORT_SHOP: import_shop
      SOCKET_IMPORT_EMPLOYEE: import_employee
      SOCKET_IMPORT_TIMEKEEPING: import_timekeeping
      SOCKET_DELETE_SHOP_RECONCILIATION: delete_shop_reconciliation
      SOCKET_EXPORT_SHOP_RECONCILIATION: export_shop_reconciliation
      
      # Processing
      CHUNK_SIZE_DEFAULT: 100
      TRANSLATE: "NO"
    
    volumes:
      # Share uploads with backend
      - ./uploads:/app/uploads
      # Persist logs
      - ./logs:/app/logs
      # Public files
      - ./public:/app/public
    
    networks:
      - xl-network
    
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    logging:
      driver: "json-file"
      options:
